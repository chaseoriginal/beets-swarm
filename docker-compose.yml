x-base: &base
  restart: unless-stopped
  networks:
    - beets-swarm_default

services:
  beets:
    <<: *base
    image: lscr.io/linuxserver/beets:latest
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - beets.config:/config
      - /media/Multimedia/Music:/music
      - /media/Multimedia/Incoming:/downloads
    ports:
      - target: 8337
        published: 8337
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.beets == true
      restart_policy:
        condition: on-failure

volumes:
  beets.config:
    name: beets.config

networks:
  beets-swarm_default:
    external: true
    name: beets-swarm_default
