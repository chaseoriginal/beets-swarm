services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    volumes:
    - beets-swarm_config:/config
    ports:
    - target: 8337
      published: 8337
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  beets-swarm_config:
    name: beets-swarm_config
